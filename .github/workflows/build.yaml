name: Build and publish

on:
  push:
    branches:
      - stable
    paths:
      - "manifests/**"
  workflow_dispatch:
    inputs:
      app:
        description: "Rebuild only this app ID (leave blank to use change detection)"
        type: string
        required: false
        default: ""
      force-all:
        description: "Rebuild every app"
        type: boolean
        required: false
        default: false
      reconcile-only:
        description: "Only reconcile the OCI index against GHCR"
        type: boolean
        required: false
        default: false
      dry-run:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: zuoye-flatpak
  cancel-in-progress: false

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/aetherpak/cli:v0.34.0
    outputs:
      matrix: ${{ steps.plan.outputs.matrix || '[]' }}
      count: ${{ steps.plan.outputs.count || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan changed apps
        id: plan
        if: ${{ !inputs.reconcile-only }}
        uses: aetherpak/actions/plan@v3.14.0
        with:
          config: aetherpak.yaml
          force: ${{ inputs.force-all && 'all' || inputs.app || '' }}
          base-sha: ${{ github.event.before || '' }}
          branch: stable
          cli-version: v0.34.0

  build:
    name: Build ${{ matrix.app-id }}
    needs: plan
    if: ${{ !inputs.reconcile-only && needs.plan.outputs.count != '0' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      image: ghcr.io/aetherpak/cli:v0.34.0-builder
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache build state
        uses: actions/cache@v6
        with:
          path: |
            .state/state-*
            .ccache
          key: flatpak-${{ runner.os }}-${{ matrix.app-id }}-${{ matrix.arch }}-${{ matrix.branch }}-${{ hashFiles('aetherpak.yaml', format('manifests/{0}/**', matrix.app-id)) }}
          restore-keys: |
            flatpak-${{ runner.os }}-${{ matrix.app-id }}-${{ matrix.arch }}-${{ matrix.branch }}-

      - name: Build package
        env:
          APP_ID: ${{ matrix.app-id }}
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ matrix.branch }}
          RUN_LINTER: ${{ matrix.run-linter || false }}
        run: |
          aetherpak build \
            --config aetherpak.yaml \
            --app-id "$APP_ID" \
            --arch "$ARCH" \
            --branch "$BRANCH" \
            --repo-path _repo \
            --run-linter="$RUN_LINTER"

      - name: Upload OSTree repo
        if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}-${{ matrix.branch }}
          path: _repo
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-oci:
    name: Push ${{ matrix.app-id }} (${{ matrix.arch }})
    needs: [plan, build]
    # Pushing is decoupled from building: it can be retried on its own, and
    # image delta generation (previous layer download + diff) does not slow
    # down the build jobs. A failed build cell has no repo artifact, so only
    # that cell's push fails.
    if: ${{ !cancelled() && needs.plan.result == 'success' && !inputs.reconcile-only && !inputs.dry-run && needs.plan.outputs.count != '0' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      image: ghcr.io/aetherpak/cli:v0.34.0-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download OSTree repo
        uses: actions/download-artifact@v8
        with:
          name: repo-${{ matrix.app-id }}-${{ matrix.arch }}-${{ matrix.branch }}
          path: _repo

      - name: Push package
        env:
          APP_ID: ${{ matrix.app-id }}
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ matrix.branch }}
          OCI_USERNAME: ${{ github.actor }}
          OCI_PASSWORD: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          : "${GPG_PRIVATE_KEY:?GPG_PRIVATE_KEY is required for publishing}"
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" > "$key_file"

          aetherpak push-oci \
            --config aetherpak.yaml \
            --app-id "$APP_ID" \
            --arch "$ARCH" \
            --branch "$BRANCH" \
            --repo-path _repo \
            --registry ghcr.io \
            --oci-repository "${GITHUB_REPOSITORY,,}" \
            --records-dir _records \
            --gpg-key "$key_file"

      - name: Upload publish records
        uses: actions/upload-artifact@v7
        with:
          name: aetherpak-record-${{ matrix.app-id }}-${{ matrix.arch }}-${{ matrix.branch }}
          path: _records
          # Preserve .aetherpak-cells and the app/Debug record directories.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish repository metadata
    needs: [plan, publish-oci]
    # Push jobs may already have published packages when another cell fails.
    # Reconcile GHCR and publish their records after all push jobs finish.
    if: ${{ !cancelled() && needs.plan.result == 'success' && !inputs.dry-run && (inputs.reconcile-only || needs.plan.outputs.count != '0') }}
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/aetherpak/cli:v0.34.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare records directory
        run: mkdir -pv _records

      - name: Download publish records
        if: ${{ !inputs.reconcile-only }}
        uses: actions/download-artifact@v8
        with:
          pattern: aetherpak-record-*
          path: _records
          merge-multiple: true

      - name: Build repository site
        uses: aetherpak/actions/publish-site@v3.14.0
        with:
          config: aetherpak.yaml
          records-dir: _records
          pages-url: https://repo.zuoye.win/flatpak
          remote-name: zuoye-flatpak
          oci-repository: ${{ github.repository }}
          landing-page: false
          signing: gpg
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          upload-pages-artifact: false
          cli-version: v0.34.0

      - name: Install publishing dependencies
        run: |
          microdnf install -y --setopt=install_weak_deps=0 --nodocs wget unzip

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1.12.0
        with:
          rclone_config: |
            [r2]
            type = s3
            provider = Cloudflare
            access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
            secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
            region = auto
            endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
            no_check_bucket = true
          disable_base64: true
          version: v1.73.1

      - name: Upload repository metadata
        run: |
          rclone copy \
            --checksum \
            --fast-list \
            --exclude 'index/static' \
            _site "r2:${{ secrets.R2_BUCKET }}/flatpak"

          rclone copyto \
            --checksum \
            _site/index/static "r2:${{ secrets.R2_BUCKET }}/flatpak/index/static"
