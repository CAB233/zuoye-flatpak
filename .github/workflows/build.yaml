name: Build and publish

on:
  push:
    branches:
      - stable
    paths:
      - "manifests/**"
  workflow_dispatch:
    inputs:
      apps:
        description: "手动指定 APP ID（空格分隔）"
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Secrets:
# - GPG_PRIVATE_KEY: 用于签名的 GPG 私钥，直接使用原文即可
# - GPG_KEY_FINGERPRINT: GPG 私钥的 ID，长的短的都可以，例如：99F583599B7E31F1
# - R2_ACCOUNT_ID: 顾名思义
# - R2_ACCESS_KEY_ID: 顾名思义
# - R2_SECRET_ACCESS_KEY: 顾名思义
# - R2_BUCKET: 顾名思义
# Variables:
# - MANIFESTS_DIR: manifest 存储根目录
# - REPO_NAME: --repo=$REPO_NAME，需要上传的仓库元数据文件夹
# - BUILD_DIR: 构建目录
env:
  MANIFESTS_DIR: ${{ vars.MANIFESTS_DIR }}
  REPO_NAME: ${{ vars.REPO_NAME }}
  BUILD_DIR: ${{ vars.BUILD_DIR }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Diff as json
        id: diff
        uses: GrantBirki/git-diff-action@v2.8.1
        with:
          base_branch: ${{ github.event.before }}
          file_output_only: true
          search_path: ${{ env.MANIFESTS_DIR }}
          json_diff_file_output: diff.json

      - name: Print json diff
        run: cat ${{ steps.diff.outputs.json-diff-path }}

      - name: Generate Matrix
        id: matrix
        run: |
          if [ -n "${{ github.event.inputs.apps }}" ]; then
            echo "apps=${{ github.event.inputs.apps }}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          apps=""
          DIFF_FILE=${{ steps.diff.outputs.json-diff-path }}
          for file in $(jq -r '.files[].path' "$DIFF_FILE"); do
            if [[ "$file" =~ ^manifests/([^/]+)/ ]]; then
              app_id="${BASH_REMATCH[1]}"
              if [[ ! " $apps " =~ " $app_id " ]]; then
                apps="$apps $app_id"
              fi
            fi
          done
          apps=$(echo "$apps" | xargs)

          if [ -z "$apps" ]; then
            echo "apps=" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "apps: $apps"
            echo "apps=$apps" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-24.04
    needs: metadata
    if: needs.metadata.outputs.has_changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup flatpak
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Setup rclone
        uses: AnimMouse/setup-rclone@v1.12.0
        with:
          rclone_config: |
            [r2]
            type = s3
            provider = Cloudflare
            access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
            secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
            region = auto
            endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
            no_check_bucket = true
          disable_base64: true
          version: v1.73.1

      - name: Import GPG
        uses: crazy-max/ghaction-import-gpg@v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Get date
        id: date
        run: |
          echo "year=$(date +'%Y')" >> $GITHUB_OUTPUT
          echo "month=$(date +'%m')" >> $GITHUB_OUTPUT
          echo "day=$(date +'%d')" >> $GITHUB_OUTPUT
          echo "hour=$(date +'%H')" >> $GITHUB_OUTPUT
          echo "minute=$(date +'%M')" >> $GITHUB_OUTPUT
          echo "second=$(date +'%S')" >> $GITHUB_OUTPUT

      - name: Restore cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .flatpak-builder
            ${{ env.REPO_NAME }}
          key: build-flatpak-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }} ${{ steps.date.outputs.hour }}:${{ steps.date.outputs.minute }}:${{ steps.date.outputs.second }}
          restore-keys: |
            build-flatpak-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }} ${{ steps.date.outputs.hour }}:${{ steps.date.outputs.minute }}:
            build-flatpak-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }} ${{ steps.date.outputs.hour }}:
            build-flatpak-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }}
            build-flatpak-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-
            build-flatpak-${{ steps.date.outputs.year }}-
            build-flatpak-

      - name: Download repo
        run: |
          rclone copy -v --copy-links --checksum r2:${{ secrets.R2_BUCKET }}/flatpak ${{ env.BUILD_DIR }}

      - name: Build packages
        id: build-packages
        run: |
          for app in ${{ needs.metadata.outputs.apps }}; do
            manifest_file="${{ env.MANIFESTS_DIR }}/${app}/${app}.yaml"
            flatpak-builder \
              --user \
              --force-clean \
              --disable-updates \
              --disable-rofiles-fuse \
              --default-branch=stable \
              --install-deps-from=flathub \
              --repo=${{ env.REPO_NAME }} \
              --gpg-sign=${{ secrets.GPG_KEY_FINGERPRINT }} \
              ${{ env.BUILD_DIR }} \
              "$manifest_file"
          done

      - name: Build repo
        id: build-repo
        run: |
          flatpak build-sign \
            --gpg-sign=${{ secrets.GPG_KEY_FINGERPRINT }} \
            ${{ env.REPO_NAME }}

          flatpak build-update-repo \
            --prune \
            --generate-static-deltas \
            --static-delta-ignore-ref=*.Debug \
            --gpg-sign=${{ secrets.GPG_KEY_FINGERPRINT }} \
            ${{ env.REPO_NAME }}

      - name: Upload repo
        run: |
          rclone copy -v --copy-links --checksum ${{ env.BUILD_DIR }} r2:${{ secrets.R2_BUCKET }}/flatpak
          rclone copy -v --copy-links --checksum *.flatpakrepo r2:${{ secrets.R2_BUCKET }}/flatpak

      - name: Cache build
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .flatpak-builder
            ${{ env.REPO_NAME }}
          key: build-flatpak-${{ steps.date.outputs.year }}-${{ steps.date.outputs.month }}-${{ steps.date.outputs.day }} ${{ steps.date.outputs.hour }}:${{ steps.date.outputs.minute }}:${{ steps.date.outputs.second }}
