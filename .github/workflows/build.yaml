name: Build and publish

on:
  push:
    branches:
      - stable
    paths:
      - "manifests/**"
      - "aetherpak.yaml"
      - ".github/workflows/build.yaml"
  workflow_dispatch:
    inputs:
      app:
        description: "Rebuild only this app ID (leave blank to use change detection)"
        type: string
        required: false
        default: ""
      force-all:
        description: "Rebuild every app"
        type: boolean
        required: false
        default: false
      reconcile-only:
        description: "Only reconcile the OCI index against GHCR"
        type: boolean
        required: false
        default: false
      dry-run:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: zuoye-flatpak
  cancel-in-progress: false

jobs:
  publish:
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      config: aetherpak.yaml
      app: ${{ inputs.app || '' }}
      force-all: ${{ inputs.force-all || false }}
      reconcile-only: ${{ inputs.reconcile-only || false }}
      dry-run: ${{ inputs.dry-run || false }}
      workflow-path: .github/workflows/build.yaml
      branch: stable
      remote-name: zuoye-flatpak
      pages-url: https://repo.zuoye.win/flatpak
      landing-page: false
      deploy: false
      artifact-name: zuoye-flatpak
      signing: gpg
    secrets:
      gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

  upload-repo:
    name: Publish repository metadata to R2
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    steps:
      - name: Download repository metadata
        uses: actions/download-artifact@v8
        with:
          name: zuoye-flatpak
          path: _site

      - name: Upload repository metadata
        uses: ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: _site
          destination-dir: flatpak
          keep-file-fresh: true
