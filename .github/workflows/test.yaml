name: Build and test

on:
  pull_request:
    branches:
      - stable

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/aetherpak/cli:v0.33.3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Plan changed apps
        id: plan
        uses: aetherpak/actions/plan@v3
        with:
          config: aetherpak.yaml
          base-sha: ${{ github.event.pull_request.base.sha }}
          workflow-path: .github/workflows/test.yaml
          branch: beta
          cli-version: v0.33.3

  test:
    name: Build ${{ matrix.app-id }} (${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    container:
      image: ghcr.io/aetherpak/cli:v0.33.3-builder
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build package
        env:
          APP_ID: ${{ matrix.app-id }}
          ARCH: ${{ matrix.arch }}
          BRANCH: ${{ matrix.branch }}
          RUN_LINTER: ${{ matrix.run-linter || false }}
        run: |
          aetherpak build \
            --config aetherpak.yaml \
            --app-id "$APP_ID" \
            --arch "$ARCH" \
            --branch "$BRANCH" \
            --repo-path _repo \
            --run-linter="$RUN_LINTER"
