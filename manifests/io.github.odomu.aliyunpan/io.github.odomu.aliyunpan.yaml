app-id: io.github.odomu.aliyunpan
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: alixby
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-run/pipewire-0
  # required to fix cursor scaling on wayland
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/debug
  - /lib/pkgconfig
  - /man
  - /share/man
  - /share/doc
  - /share/gtk-doc

modules:
  - name: aliyunpan
    buildsystem: simple
    build-commands:
      - bsdtar -xf aliyunpan.xz
      - mkdir -pv electron-runtime
      - bsdtar -xf electron.zip -C electron-runtime
      - mv -v "opt/阿里云盘小白羊/resources" app-resources
      - mv -v app.asar app-resources/app.asar
      - mkdir -pv ${FLATPAK_DEST}/alixby
      - cp -av electron-runtime/. ${FLATPAK_DEST}/alixby/
      - rm -rv ${FLATPAK_DEST}/alixby/resources
      - mv -v app-resources ${FLATPAK_DEST}/alixby/resources
      - mv -v ${FLATPAK_DEST}/alixby/electron ${FLATPAK_DEST}/alixby/alixby
      - install -Dvm644 ${FLATPAK_ID}.png -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps
      - install -Dvm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dvm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dvm755 alixby.sh /app/bin/alixby
    sources:
      - type: file
        dest-filename: aliyunpan.xz
        only-arches:
          - x86_64
        url: https://repo.zuoye.win/archive/aliyunpan-odomu-bin/alixby-3.24.41217-linux-x64.pacman
        sha256: 552bd1f0562868afb144718dce7a58ecb49fbe049c7569b129d0f03764bfa02e
      - type: file
        dest-filename: app.asar
        url: https://repo.zuoye.win/archive/aliyunpan-odomu-bin/app.asar
        sha256: 9a3115a6a892b7a7d9c87713cfa6a0b0d15d279a3d906a7dc2cbb5ac2764a81d
      - type: file
        dest-filename: electron.zip
        only-arches:
          - x86_64
        url: https://github.com/electron/electron/releases/download/v42.11.12/electron-v42.11.12-linux-x64.zip
        sha256: 1f17c115389c6395ce4b19b29ee2ec4be2208257514d61e269f1c0a7323bd45d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/electron/electron/releases?per_page=100
          version-query: '[.[] | select(.prerelease == false)
            | select(.tag_name | startswith("v42."))][0].tag_name | sub("^v"; "")'
          url-query: '"https://github.com/electron/electron/releases/download/v" + $version
            + "/electron-v" + $version + "-linux-x64.zip"'
      - type: script
        dest-filename: alixby.sh
        commands:
          # Keep tray icon temp files in the app runtime dir so GNOME can resolve them without needing /tmp access
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/alixby/alixby "$@"
      - type: file
        path: io.github.odomu.aliyunpan.png
      - type: file
        path: io.github.odomu.aliyunpan.desktop
      - type: file
        path: io.github.odomu.aliyunpan.metainfo.xml
