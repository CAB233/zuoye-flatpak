id: com.vscodium.codium
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: codium
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=ssh-auth
  - --device=all
  - --persist=.vscode-oss
  - --persist=.vscode-oss-shared
  - --allow=devel
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.freedesktop.Flatpak
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-run/gnupg:ro
  - --filesystem=xdg-config/kdeglobals:ro
  - --talk-name=com.canonical.AppMenu.Registrar
  - --system-talk-name=org.freedesktop.login1
separate-locales: false
add-extensions:
  com.visualstudio.code.tool:
    directory: tools
    subdirectories: true
    version: '26.08'
    add-ld-path: lib
    no-autodownload: true
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'
modules:
  - name: host-spawn
    buildsystem: simple
    build-commands:
      - install -Dvm755 host-spawn ${FLATPAK_DEST}/bin/host-spawn
    sources:
      - type: file
        url: https://github.com/1player/host-spawn/releases/download/v1.6.2/host-spawn-x86_64
        sha256: 077bc09a087292447ba17cfe2156a93f71bf56c4c6be8e38d3abe65c1240f34c
        dest-filename: host-spawn
        only-arches: 
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/1player/host-spawn/releases/latest
          version-query: .tag_name
          timestamp-query: .published_at
          url-query: '"https://github.com/1player/host-spawn/releases/download/" +
            $version + "/host-spawn-x86_64"'

  - name: codium
    buildsystem: simple
    build-commands:
      - ar x codium.deb
      - tar xf data.tar.xz
        # fix kde wayland window icons
      - patch --fuzz 3 -u usr/share/codium/resources/app/package.json -i package.json.patch
      - patch -u usr/share/applications/com.visualstudio.CodeOSS.desktop -i codium.desktop.patch
      - patch -u usr/share/applications/com.visualstudio.CodeOSS.UrlHandler.desktop -i codium-url-handler.desktop.patch
      - mv -v usr/share/codium ${FLATPAK_DEST}/codium
      - install -Dvm644 usr/share/applications/com.visualstudio.CodeOSS.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dvm644 usr/share/applications/com.visualstudio.CodeOSS.UrlHandler.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}-url-handler.desktop
      - install -Dvm644 code.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dvm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dvm644 usr/share/mime/packages/codium-workspace.xml ${FLATPAK_DEST}/share/mime/packages/${FLATPAK_ID}-workspace.xml
      - mkdir -pv ${FLATPAK_DEST}/tools
    sources:
      - type: file
        url: 
          https://github.com/VSCodium/vscodium/releases/download/1.143.17232/codium_1.143.17232_amd64.deb
        sha256: 988330df203f4d2dbfb9ee0052a0356a27af7c0a2a7ff606424c531ae4a7b538
        dest-filename: codium.deb
        only-arches:
          - x86_64
        x-checker-data:
          type: json
          url: https://api.github.com/repos/VSCodium/vscodium/releases/latest
          tag-query: .tag_name
          version-query: .tag_name
          timestamp-query: .published_at
          url-query: .assets[] | select(.name|test("codium_.+_amd64.deb$")).browser_download_url
      - type: file
        url: 
          https://raw.githubusercontent.com/VSCodium/vscodium/refs/heads/insider/src/stable/resources/linux/code.svg
        sha256: e622e6bdb70b0cfec57ad9df8717ea023b87e5e215003119b5a1a4d059fcd347
      - type: file
        path: com.vscodium.codium.metainfo.xml
      - type: file
        path: patches/package.json.patch
      - type: file
        path: patches/codium.desktop.patch
      - type: file
        path: patches/codium-url-handler.desktop.patch

  - name: wrapper-flatpak-wrapper
    buildsystem: meson
    config-opts:
      - -Dprogram_name=codium
      - -Deditor_binary=/app/codium/codium
      - -Deditor_args=['/app/codium/resources/app/out/cli.js', '--extensions-dir', '$XDG_DATA_HOME/codium/extensions']
      - -Deditor_title=VSCodium
      - -Dzypak=enabled
      - -Dzypak_args=['host', '-']
      - -Denvs=["ELECTRON_RUN_AS_NODE=1"]
      - -Denvs_inner=["ZYPAK_SPAWN_LATEST_ON_REEXEC=0"]
      - -Dsdk_update_template=sdk_update.md
      - -Dflagfile_prefix=flatpak-vscodium
    sources:
      - type: git
        url: https://github.com/flathub-infra/ide-flatpak-wrapper.git
        commit: 14e85b05d804c9e556ddbea9173bdb4bc2c3bd71
      - type: file
        path: sdk_update.md
