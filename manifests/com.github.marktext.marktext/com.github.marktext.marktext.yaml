app-id: com.github.marktext.marktext
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: marktext
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-documents
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: marktext
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin
      build-args:
        - --share=network
      env:
        COREPACK_HOME: /app/share/corepack
        XDG_CACHE_HOME: /app/share/build-cache
        npm_config_cache: /app/share/build-cache/npm
        npm_config_user_agent: pnpm
        USE_ELECTRON_CLANG: '0'
    build-commands:
      - corepack enable --install-directory=${FLATPAK_DEST}/bin pnpm
      - pnpm install --frozen-lockfile --ignore-scripts --store-dir=${FLATPAK_DEST}/share/build-cache/pnpm
      - pnpm exec tsx scripts/postinstall.ts
      - pnpm run build
      - pnpm --dir packages/desktop exec electron-builder --linux --dir --publish never --config.electronDist=node_modules/electron/dist
      - mkdir -pv ${FLATPAK_DEST}/marktext
      - cp -av dist/linux*-unpacked/. ${FLATPAK_DEST}/marktext/
      - install -Dvm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dvm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dvm644 ${FLATPAK_ID}.png -t ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps
      - install -Dvm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
      - install -Dvm755 marktext.sh ${FLATPAK_DEST}/bin/marktext
    cleanup:
      - /bin/pnpm
      - /bin/pnpx
      - /share/corepack
      - /share/build-cache
    sources:
      - type: git
        url: https://github.com/marktext/marktext.git
        tag: v0.21.2
        commit: ae7a869c989950a3a56ce5c2f7fc0df12c652933
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
          is-main-source: true
      - type: script
        dest-filename: marktext.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/marktext/marktext "$@"
      - type: file
        path: com.github.marktext.marktext.desktop
      - type: file
        path: com.github.marktext.marktext.metainfo.xml
      - type: file
        path: com.github.marktext.marktext.png
