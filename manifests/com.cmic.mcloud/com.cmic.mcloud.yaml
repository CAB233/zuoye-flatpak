app-id: com.cmic.mcloud
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: mcloud
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --persist=mCloud
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.kde.StatusNotifierWatcher # legacy tray support
  - --talk-name=org.freedesktop.Notifications # legacy tray support
  - --own-name=org.kde.StatusNotifierItem-2-1 # legacy tray support
  - --own-name=org.kde.StatusNotifierItem-3-1 # legacy tray support

modules:
  # 内置 Qt5 与 ICU63，但实际其 Qt5 依赖 ICU 66
  - name: icu66
    only-arches:
      - x86_64
    buildsystem: autotools
    subdir: source
    config-opts:
      - --disable-static
      - --disable-tests
      - --disable-samples
      - --disable-extras
      - --disable-icuio
    cleanup:
      - /bin
      - /include
      - /lib/icu
      - /lib/pkgconfig
      - /share/icu
      - '*.la'
    sources:
      - type: archive
        url: https://github.com/unicode-org/icu/releases/download/release-66-1/icu4c-66_1-src.tgz
        sha256: 52a3f2209ab95559c1cf0a14f24338001f389615bf00e2585ef3dbc43ecf0a2e

  - name: mcloud
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - install -Dvm644 ${FLATPAK_ID}.png -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps
      - install -Dvm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dvm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dvm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - install -Dvm755 mcloud.sh ${FLATPAK_DEST}/bin/mcloud
    sources:
      - type: extra-data
        filename: mcloud.deb
        only-arches:
          - x86_64
        url: https://yun.mcloud.139.com/mCloudPc/kylinV111/com.cmic.mcloud_1.1.1_amd64.deb
        sha256: 0e28a7fe6125e32c06e27c3b7645acb3bf1e90decadc36327bbb79916aa6f4b0
        size: 165376280

      - type: script
        dest-filename: apply_extra
        commands:
          - bsdtar -xf mcloud.deb
          - bsdtar -xf data.tar.xz
          - mv opt/apps/com.cmic.mcloud mcloud
          - find ./ -type d -exec chmod 755 {} \;
          - |
            # 解包临时文件和 Debian 安装目录。
            rm -rv -- \
              mcloud.deb \
              control.tar.* \
              data.tar.* \
              debian-binary \
              opt/ \
              usr/

            # 冗余的 Node.js 依赖和 zip-7z 文件。
            rm -rv -- \
              mcloud/resources/app.asar.unpacked/node_modules/phantomjs-prebuilt \
              mcloud/resources/app.asar.unpacked/node_modules/zip-7z/bin \
              mcloud/resources/app.asar.unpacked/node_modules/zip-7z/src

            # 其他平台的资源和 Windows 插件。
            rm -rv -- \
              mcloud/resources/app.asar.unpacked/resources/icons_mac/ \
              mcloud/resources/app.asar.unpacked/resources/uos* \
              mcloud/plugins/gmssl.dll

            # ICU 由 icu66 模块提供，清理 deb 内附的旧版本。
            rm -rv -- mcloud/processes/libicu*.so*

          - |
            # 麒麟版 1.1.1：日志资源由 log4cpp 的 Category 负责回收，
            # 桥接库析构时再次清理会访问已释放的 Category / Appender。
            # 更新上游版本时需重新核对该补丁；哈希不匹配则停止安装。
            log_bridge=mcloud/processes/liblog4cppbridge.so
            printf '%s  %s\n' \
              '2d889c27461025930caa3f24e10245181fe0fdef8bddd837ad1250ee69aa50f2' \
              "$log_bridge" | sha256sum --check --status || {
                echo 'Unsupported liblog4cppbridge.so: review the mCloud exit patch.' >&2
                exit 1
              }

            # x86_64，偏移 0x3f54：CALL shutdown() 改为 JMP 0x3f68，
            # 跳过日志资源清理，继续执行桥接库自身字符串成员的析构。
            printf '\353\022\220\220\220' |
              dd of="$log_bridge" bs=1 seek=$((0x3f54)) conv=notrunc status=none

      - type: script
        dest-filename: mcloud.sh
        commands:
          - ulimit -c 0
          - export LD_LIBRARY_PATH="/app/extra/mcloud/plugins:/app/extra/mcloud/processes:/app/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          - export QT_QPA_PLATFORM_PLUGIN_PATH=/app/extra/mcloud/processes
          - |
            if [ "${MCLOUD_DEBUG:-0}" != 1 ]; then
              exec >/dev/null 2>&1
            fi
          - exec zypak-wrapper /app/extra/mcloud/mcloud "$@"

      - type: file
        path: com.cmic.mcloud.png
      - type: file
        path: com.cmic.mcloud.desktop
      - type: file
        path: com.cmic.mcloud.metainfo.xml
