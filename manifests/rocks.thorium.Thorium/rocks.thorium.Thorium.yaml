app-id: rocks.thorium.Thorium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.chromium.Chromium.BaseApp
base-version: '25.08'
command: thorium
separate-locales: false
finish-args:
  - --require-version=1.8.2
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=cups
  - --socket=pcsc # FIDO2
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.gnome.SessionManager
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  - --persist=.pki
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --filesystem=xdg-desktop
  - --filesystem=xdg-download
  - --filesystem=xdg-run/dconf # For GNOME proxy resolution
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=~/.config/dconf:ro # For GNOME proxy resolution
  - --filesystem=~/.config/kioslaverc # For KDE proxy resolution (KDE5 only)
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf # For GNOME proxy resolution
  - --env=GIO_EXTRA_MODULES=/app/lib/gio/modules # For GNOME proxy resolution
  - --env=GSETTINGS_BACKEND=dconf # For GNOME proxy resolution
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/debug
  - /lib/pkgconfig
  - /man
  - /share/man
  - /share/doc
  - /share/gtk-doc

modules:
  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dbash_completion=false
      - -Dman=false
      - -Dvapi=false
    cleanup:
      - /etc
      - /include
      - ca.desrt.dconf.service
      - dconf.service
      - dconf-service
      - '*.pc'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/dconf/0.49/dconf-0.49.0.tar.xz
        sha256: 16a47e49a58156dbb96578e1708325299e4c19eea9be128d5bd12fd0963d6c36
        x-checker-data:
          type: gnome
          name: dconf
          stable-only: true
      # From: https://src.fedoraproject.org/rpms/dconf
      - type: patch
        path: dconf-override.patch

  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: thorium
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/thorium
      - bsdtar --no-same-owner -xf thorium.zip -C ${FLATPAK_DEST}/thorium
      - install -Dvm755 thorium.sh ${FLATPAK_DEST}/bin/thorium
      - install -Dvm644 cobalt.ini -t ${FLATPAK_DEST}/etc
      - install -Dvm644 rocks.thorium.Thorium.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dvm644 rocks.thorium.Thorium.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dvm644 ${FLATPAK_DEST}/thorium/thorium.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/rocks.thorium.Thorium.svg
    cleanup:
      - /thorium/thorium.svg
      - /thorium/chrome-management-service
      - /thorium/content_shell.pak
      - /thorium/default-app-block
      - /thorium/initial_preferences
      - /thorium/pak
      - '/thorium/product_logo_*'
      - /thorium/shell_resources.pak
      - '/thorium/thorium_shell*'
      - '/thorium/*.desktop'
      - /thorium/THORIUM-PORTABLE
      - '/thorium/xdg-*'
    sources:
      - type: file
        url: https://github.com/Alex313031/thorium/releases/download/M138.0.7204.303/thorium-browser_138.0.7204.303_AVX2.zip
        sha256: 07b980b76735733a1c45b8cba340a2947aa68f9ccdc6f26511135752d4a1ca22
        dest-filename: thorium.zip
        only-arches:
          - x86_64
        x-checker-data:
          type: anitya
          project-id: 373887
          stable-only: true
          url-template: https://github.com/Alex313031/thorium/releases/download/M${version}/thorium-browser_${version}_AVX2.zip
      - type: file
        path: thorium.sh
      - type: file
        path: cobalt.ini
      - type: file
        path: rocks.thorium.Thorium.desktop
      - type: file
        path: rocks.thorium.Thorium.metainfo.xml
