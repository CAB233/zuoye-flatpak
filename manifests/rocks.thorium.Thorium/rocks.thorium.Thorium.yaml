app-id: rocks.thorium.Thorium
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.chromium.Chromium.BaseApp
base-version: '26.08'
command: thorium
separate-locales: false
finish-args:
  - --require-version=1.8.2
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=cups
  - --socket=pcsc # FIDO2
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --system-talk-name=org.bluez
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.gnome.SessionManager
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  - --persist=.pki
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --filesystem=xdg-desktop
  - --filesystem=xdg-download
  - --filesystem=xdg-run/dconf # For GNOME proxy resolution
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=~/.config/dconf:ro # For GNOME proxy resolution
  - --filesystem=~/.config/kioslaverc # For KDE proxy resolution (KDE5 only)
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf # For GNOME proxy resolution
  - --env=GIO_EXTRA_MODULES=/app/lib/gio/modules # For GNOME proxy resolution
  - --env=GSETTINGS_BACKEND=dconf # For GNOME proxy resolution
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/debug
  - /lib/pkgconfig
  - /man
  - /share/man
  - /share/doc
  - /share/gtk-doc

modules:
  - name: dconf
    buildsystem: meson
    config-opts:
      - -Dbash_completion=false
      - -Dman=false
      - -Dvapi=false
    cleanup:
      - /etc
      - /include
      - ca.desrt.dconf.service
      - dconf.service
      - dconf-service
      - '*.pc'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/dconf/51/dconf-51.0.tar.xz
        sha256: e65c1b7867f836faad9f9ee04acf5c5a6cae2bbc784833fe093207e0cb590248
        x-checker-data:
          type: gnome
          name: dconf
          stable-only: true
      # From: https://src.fedoraproject.org/rpms/dconf
      - type: patch
        path: dconf-override.patch

  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: thorium
    buildsystem: simple
    build-commands:
      - bsdtar -xf thorium.deb
      - bsdtar -xf data.tar.xz
      - mv -v opt/chromium.org/thorium ${FLATPAK_DEST}/thorium
      - install -Dvm755 thorium.sh ${FLATPAK_DEST}/bin/thorium
      - install -Dvm644 cobalt.ini -t ${FLATPAK_DEST}/etc
      - install -Dvm644 ${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dvm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dvm644 ${FLATPAK_DEST}/thorium/thorium.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - unlink -- ${FLATPAK_DEST}/thorium/thorium-browser
      - unlink -- ${FLATPAK_DEST}/thorium/pak
    cleanup:
      - /thorium/thorium.svg
      - /thorium/content_shell.pak
      - /thorium/default-app-block
      - /thorium/pak
      - /thorium/product_logo_*
      - /thorium/shell_resources.pak
      - /thorium/thorium_shell*
    sources:
      - type: file
        url: https://github.com/gz83/thorium/releases/download/M156.0.8078.28/thorium-browser_156.0.8078.28_AVX2.deb
        sha256: 15496ebae54d15a946e1cad9ecc174f50008cc355e35be58ff339ec23bf00846
        dest-filename: thorium.deb
        only-arches:
          - x86_64
        x-checker-data:
          type: anitya
          project-id: 373887
          stable-only: true
          url-template: https://github.com/gz83/thorium/releases/download/M${version}/thorium-browser_${version}_AVX2.deb
      - type: script
        dest-filename: thorium.sh
        commands:
          - exec cobalt "$@" --no-default-browser-check
      - type: file
        path: cobalt.ini
      - type: file
        path: rocks.thorium.Thorium.desktop
      - type: file
        path: rocks.thorium.Thorium.metainfo.xml
